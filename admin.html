<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | Cup2Eat</title><link rel="stylesheet" href="css/style.css"></head>
<body class="admin"><section><div class="wrap"><h1>Cup2Eat Admin</h1><p class="lead">Data is saved in this browser only (localStorage). Connect a backend or Firebase before using it for live multi-device management.</p>
<div class="tabs"><button class="btn on" data-tab="pp">Products</button><button class="btn" data-tab="rp">Reviews</button></div>
<div class="pane" id="pp"><form id="pf" class="card"><div class="two"><label>Name<input name="name" required></label><label>Flavour<input name="flavour"></label></div><label>Description<input name="desc"></label><div class="two"><label>Price (₹)<input name="price" type="number" min="0" required></label><label>Available quantity<input name="qty" type="number" min="0" required></label></div><label>Image URL<input name="img" type="url"></label><button class="btn" type="submit">Add product</button></form>
<table><thead><tr><th>Name</th><th>Flavour</th><th>Price</th><th>Qty</th><th></th></tr></thead><tbody id="pl"></tbody></table></div>
<div class="pane" id="rp" hidden><form id="rf" class="card"><label>Customer name<input name="name" required></label><label>Review (real customer feedback only)<textarea name="text" rows="3" required></textarea></label><button class="btn" type="submit">Add review</button></form>
<table><thead><tr><th>Name</th><th>Review</th><th></th></tr></thead><tbody id="rl"></tbody></table></div></div></section><script src="js/admin.js"></script></body></html>
